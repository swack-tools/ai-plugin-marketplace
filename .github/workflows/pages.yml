name: Build and deploy marketplace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      plugin_repository:
        description: 'Plugin repository requesting the rebuild (leave empty for a manual refresh)'
        required: false
        type: string
      plugin_tag:
        description: 'Published plugin tag (required with plugin_repository)'
        required: false
        type: string
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out marketplace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.lock
      - name: Validate release notification
        if: github.event_name == 'workflow_dispatch'
        env:
          PLUGIN_REPOSITORY: ${{ inputs.plugin_repository }}
          PLUGIN_TAG: ${{ inputs.plugin_tag }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          repository = os.environ['PLUGIN_REPOSITORY']
          tag = os.environ['PLUGIN_TAG']
          allowed = {p['repo'] for p in json.loads(Path('catalog/projects.json').read_text())['projects']}
          if repository or tag:
              if repository not in allowed or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?', tag):
                  raise SystemExit('Expected a configured plugin repository and a version tag.')
              message = f'Release refresh requested by `{repository}` for `{tag}`.\n'
          else:
              message = 'Manual marketplace refresh.\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message)
          PYTHON
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-site.lock
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build offline fixtures
        run: python scripts/build_site.py --offline tests/fixtures/catalog --output build/offline
      - name: Build verified live catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_site.py --live --output build/site
      - name: Check out reviewed prose tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: swack-tools/vale-ai-plugin
          ref: 0cf1d30cae0b8087c9351894a313563f4b938e58
          path: .cache/vale-plugin
          sparse-checkout: plugins/vale
          persist-credentials: false
      - name: Install verified Vale binary
        run: |
          mkdir -p .cache/vale-bin
          curl --fail --location --silent --show-error --output .cache/vale.tar.gz https://github.com/vale-cli/vale/releases/download/v3.23.0/vale_3.23.0_Linux_64-bit.tar.gz
          echo 'cc35445a45186b8f0b01e11c01359694cf941e72cf6ab0fc44774f0e54c9d5fc  .cache/vale.tar.gz' | sha256sum --check
          tar -xzf .cache/vale.tar.gz -C .cache/vale-bin vale
          echo "$GITHUB_WORKSPACE/.cache/vale-bin" >> "$GITHUB_PATH"
      - name: Check prose with the Vale plugin
        run: python scripts/check_prose.py --plugin-root .cache/vale-plugin/plugins/vale
      - name: Check generated site
        run: python scripts/check_site.py --site build/site --catalog build/catalog.json
      - name: Upload review preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketplace-preview
          path: build/site
          retention-days: 7
      - name: Upload provenance reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-provenance
          path: |
            build/sources.lock.json
            build/catalog-report.json
          retention-days: 7
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
